name: Build and publish Basic Motion

on:
  push:
    tags: ['motion-basic-v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.repository == 'endless1233214/plainnvr-os-apps'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check release tag and manifest version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#motion-basic-v}"
          test "motion-basic-v${version}" = "$GITHUB_REF_NAME"
          test "$version" = "$(python3 -c 'import json; print(json.load(open("apps/motion-basic/manifest.json"))["version"])')"

      - name: Unit test and build CPU-only image
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s apps/motion-basic -p test_motion.py -v
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/plainnvr-motion-basic"
          version="${GITHUB_REF_NAME#motion-basic-v}"
          docker build --platform linux/amd64 -t "$image:$version" -t "$image:$version-${GITHUB_SHA:0:12}" apps/motion-basic

      - name: Test PlainNVR RTSP restream and event delivery
        shell: bash
        run: |
          set -euo pipefail
          export MOTION_IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/plainnvr-motion-basic:${GITHUB_REF_NAME#motion-basic-v}"
          python3 apps/motion-basic/integration_test.py

      - name: Publish immutable commit tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/plainnvr-motion-basic:${GITHUB_REF_NAME#motion-basic-v}-${GITHUB_SHA:0:12}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT
          docker push "$image" | tee "$RUNNER_TEMP/motion-push.log"
          digest="$(sed -n 's/.*digest: \(sha256:[a-f0-9]\{64\}\).*/\1/p' "$RUNNER_TEMP/motion-push.log" | tail -1)"
          test -n "$digest"
          printf 'Published `%s@%s`\n' "${image%:*}" "$digest" >> "$GITHUB_STEP_SUMMARY"
