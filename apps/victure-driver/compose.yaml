# Join the recorder's private Compose network. Do not publish a host port.
services:
  victure-driver:
    image: ghcr.io/endless1233214/plainnvr-victure-driver@sha256:7a8823f133fb44327c8bbb90292429303d7baae6bc4ed492f0be9e304aeba45c
    restart: unless-stopped
    read_only: true
    user: "568:568"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      VICTURE_DRIVER_TOKEN_FILE: /run/secrets/victure_driver_token
    secrets: [victure_driver_token]
    networks: [plainnvr]

secrets:
  victure_driver_token:
    file: ${VICTURE_DRIVER_TOKEN_FILE:?set the token file path}

networks:
  plainnvr:
    external: true
